<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Bracket </title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        .top-nav { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; }
        .nav-btn { background: #334155; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1rem; }
        .nav-btn:hover { background: #475569; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }

        h1 { margin-top: 80px; font-size: clamp(1.8rem, 4vw, 2.5rem); text-transform: uppercase; letter-spacing: 2px; color: #facc15; text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); text-align: center; }
        
        button.action-btn { background: #3b82f6; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        button.action-btn:hover:not(:disabled) { background: #2563eb; transform: scale(1.05); }

        #lobby-screen { text-align: center; margin-top: 50px; background: #1e293b; padding: 40px; border-radius: 15px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        select#set-selector { width: 100%; padding: 15px; font-size: 1.2rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-bottom: 25px; font-weight: bold; cursor: pointer;}

        #duel-screen { display: none; width: 100%; max-width: 1200px; text-align: center; padding: 0 10px; box-sizing: border-box; }
        .arena { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 30px; padding: 20px 0; }
        
        .fighter { background: #1e293b; border: 3px solid #334155; border-radius: 15px; width: 42vw; max-width: 450px; min-width: 280px; cursor: pointer; transition: all 0.3s ease; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .fighter:hover { transform: translateY(-5px) scale(1.02); border-color: #3b82f6; box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4); }
        .fighter img { width: 100%; height: 45vh; min-height: 350px; max-height: 550px; object-fit: cover; }
        .fighter p { font-size: clamp(1.2rem, 2.5vw, 1.8rem); font-weight: bold; margin: 15px 0; padding: 0 10px; }
        
        /* LA CLASSE MAGIQUE POUR COLORER L'IMAGE CASSÉE EN ROUGE */
        .img-broken { filter: sepia(100%) hue-rotate(320deg) saturate(500%); border-color: #ef4444 !important; }

        .vs { font-size: 3rem; font-weight: bold; font-style: italic; color: #ef4444; text-shadow: 2px 2px 0 #000; margin: 0 20px; }

        .match-controls { margin-top: 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .ctrl-btn { background: #475569; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; transition: 0.2s;}
        .ctrl-btn:hover { background: #64748b; }

        #history-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; text-align: left; }
        .history-item { background: #334155; margin: 10px 0; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="nav-btn" onclick="window.location.href='index.html'">⬅️ Éditer les persos</button>
        <button id="reset-btn" class="nav-btn btn-danger" onclick="resetTournament()" style="display:none;">🔄 Recommencer ce Set à zéro</button>
    </div>

    <h1>Bracket</h1>

    <!-- LE LOBBY -->
    <div id="lobby-screen">
        <h2 style="color: #cbd5e1; margin-top: 0;">Sélectionnez le Set à jouer</h2>
        <select id="set-selector">
            <option value="">Chargement des sets...</option>
        </select>
        <button id="start-btn" class="action-btn" style="width: 100%; display:none;" onclick="loadOrStartSet()">Lancer / Reprendre</button>
    </div>

    <!-- ECRAN DE JEU -->
    <div id="duel-screen">
        <h2 id="round-title" style="color: #94a3b8; font-size: clamp(1.2rem, 3vw, 1.8rem); margin-bottom: 5px;">Préparation...</h2>
        <p style="color: #cbd5e1; font-size: 1.2rem; margin-top: 0; margin-bottom: 20px;">Match <span id="match-number">1</span> sur <span id="total-matches">X</span></p>
        
        <div class="arena">
            <div class="fighter" id="card-left" onclick="selectWinner('left')">
                <img id="img-left" src="">
                <p id="name-left">Combattant 1</p>
            </div>
            <div class="vs">VS</div>
            <div class="fighter" id="card-right" onclick="selectWinner('right')">
                <img id="img-right" src="">
                <p id="name-right">Combattant 2</p>
            </div>
        </div>
        
        <div class="match-controls">
            <button class="ctrl-btn" onclick="undoLastMatch()">⏪ Annuler le dernier match</button>
            <button class="ctrl-btn" onclick="openHistory()">📜 Historique </button>
        </div>
    </div>

    <div id="history-modal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">Historique du tournoi</h2>
            <div id="history-list"></div>
            <button class="action-btn" style="width: 100%; margin-top: 20px; background: #475569;" onclick="closeHistory()">Fermer l'historique</button>
        </div>
    </div>

    <div id="winner-screen" style="display:none; text-align: center;">
        <h2 style="font-size: clamp(2rem, 5vw, 3rem); color: #facc15;">🏆 LE GOAT DU SET 🏆</h2>
        <h3 id="winner-name" style="font-size: 2.5rem; margin: 10px 0;"></h3>
        <img id="winner-img" src="" style="width: 90vw; max-width: 500px; height: 50vh; min-height: 400px; object-fit: cover; border-radius: 20px; border: 5px solid #facc15;">
    </div>

    <script>
        const SUPABASE_URL = 'https://ighevbtlfsjrtyajgcwy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnaGV2YnRsZnNqcnR5YWpnY3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDc1NTcsImV4cCI6MjEwNTU4MzU1N30.db99R6p6E8rOekBWly1WvlT0oVsH-LNhihw-Km_3SP8';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { global: { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } } });

        const TIER_WEIGHTS = { 'S': 6, 'A': 5, 'B': 4, 'C': 3, 'D': 2, 'E': 1 };
        
        // NOUVELLE IMAGE PAR DEFAUT
        const DEFAULT_IMAGE = 'https://media.istockphoto.com/id/2168774111/fr/vectoriel/avatar-ou-signe-de-la-personne-photo-de-profil-ic%C3%B4ne-de-portrait-symbole-de-profil.jpg?s=612x612&w=0&k=20&c=JX4sttMe4ywxQyMFXALeNOdHnvOXxq1nj74ohyMevrs=';
        
        let activeSetName = "";
        let allParticipants = [];
        let decisions = {}; 
        let matchHistory = []; 

        // Fonction pour afficher l'image et la passer en rouge si elle est cassée
        function setSafeImage(imgElement, url) {
            imgElement.classList.remove('img-broken'); // On réinitialise l'état
            imgElement.src = url || DEFAULT_IMAGE;
            imgElement.onerror = function() {
                this.onerror = null; // Evite une boucle infinie
                this.src = DEFAULT_IMAGE;
                this.classList.add('img-broken'); // Ajoute le filtre rouge CSS
            };
        }

        async function initLobby() {
            let allCategories = [];
            let from = 0;
            const step = 1000;
            let keepFetching = true;

            // Boucle pour récupérer les catégories de TOUS les personnages (au-delà de 1000)
            while (keepFetching) {
                const { data, error } = await client
                    .from('characters')
                    .select('categorie')
                    .range(from, from + step - 1);
                    
                if (error) return alert("Erreur de connexion.");
                
                allCategories = allCategories.concat(data);
                
                if (data.length < step) keepFetching = false;
                else from += step;
            }

            const categories = [...new Set(allCategories.map(c => c.categorie || 'Général'))].sort();
            
            const selector = document.getElementById('set-selector');
            selector.innerHTML = '';
            categories.forEach(cat => {
                selector.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
            
            if (categories.length > 0) {
                document.getElementById('start-btn').style.display = 'block';
            } else {
                selector.innerHTML = '<option>Aucun personnage trouvé</option>';
            }
        }

        window.loadOrStartSet = async function() {
            activeSetName = document.getElementById('set-selector').value;
            let btn = document.getElementById('start-btn');
            btn.innerText = "Chargement...";
            btn.disabled = true;

            const { data, error } = await client.from('bracket_saves').select('*').eq('set_name', activeSetName).single();
            
            if (data && data.save_data) {
                allParticipants = data.save_data.allParticipants;
                decisions = data.save_data.decisions;
                launchUI();
            } else {
                await initNewBracketForSet(activeSetName);
            }
        };

        async function initNewBracketForSet(setName) {
            let data = [];
            let from = 0;
            const step = 1000;
            let keepFetching = true;

            // Récupérer tous les personnages du Set ciblé avec pagination
            while (keepFetching) {
                let query = client.from('characters').select('*').range(from, from + step - 1);
                if (setName !== 'Général') {
                    query = query.eq('categorie', setName);
                }
                
                const { data: chunk, error } = await query;
                if (error) return alert("Erreur lors du chargement des combattants.");
                
                data = data.concat(chunk);
                if (chunk.length < step) keepFetching = false;
                else from += step;
            }

            // Cas spécifique du set "Général" : rattraper ceux dont la catégorie est restée à null
            if (setName === 'Général') {
                from = 0;
                keepFetching = true;
                while (keepFetching) {
                    const { data: nullChunk, error } = await client
                        .from('characters')
                        .select('*')
                        .is('categorie', null)
                        .range(from, from + step - 1);
                        
                    if (error) break;
                    if (nullChunk) data = data.concat(nullChunk);
                    
                    if (nullChunk.length < step) keepFetching = false;
                    else from += step;
                }
            }

            if (data.length < 2) return alert(`Il faut au moins 2 personnages dans le set "${setName}" !`);

            data.sort((a, b) => (TIER_WEIGHTS[b.tier] || 0) - (TIER_WEIGHTS[a.tier] || 0) || Math.random() - 0.5);
            let nextPowerOf2 = 2;
            while (nextPowerOf2 < data.length) nextPowerOf2 *= 2;

            let byesNeeded = nextPowerOf2 - data.length;
            let initialRoster = [...data];
            for (let i = 0; i < byesNeeded; i++) initialRoster.push({ id: 'bye-'+i, isBye: true, name: 'BYE' });

            allParticipants = createSeededBracket(initialRoster);
            decisions = {};
            
            saveTournament(); 
            launchUI();
        }

        function createSeededBracket(roster) {
            const mathLog = Math.log2(roster.length);
            let bracket = [1, 2];
            for (let i = 1; i < mathLog; i++) {
                let temp = [], sum = Math.pow(2, i + 1) + 1;
                for (let j = 0; j < bracket.length; j++) { temp.push(bracket[j]); temp.push(sum - bracket[j]); }
                bracket = temp;
            }
            return bracket.map(seed => roster[seed - 1]);
        }

        function launchUI() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'inline-block';
            updateGame(); 
        }

        async function saveTournament() {
            if (!activeSetName) return;
            const { error } = await client.from('bracket_saves').upsert({
                set_name: activeSetName,
                save_data: { allParticipants, decisions }
            });
            if (error) console.error("Erreur de sauvegarde :", error);
        }

        window.resetTournament = async function() {
            if (confirm(`⚠️ Effacer la progression du set "${activeSetName}" et recommencer ce tournoi à zéro ?`)) {
                await client.from('bracket_saves').delete().eq('set_name', activeSetName);
                location.reload();
            }
        };

        function getRoundName(count) {
            if (count === 2) return "Grande Finale";
            if (count === 4) return "Demi-finales";
            if (count === 8) return "Quarts de finale";
            if (count === 16) return "Huitièmes de finale";
            if (count === 32) return "Seizièmes de finale";
            if (count === 64) return "Trente-deuxièmes de finale";
            if (count === 128) return "Soixante-quatrièmes de finale";
            return "Top " + count;
        }

        function updateGame() {
            matchHistory = [];
            let currentRound = [...allParticipants];
            let roundIndex = 0;
            let pendingMatch = null;

            while (currentRound.length > 1) {
                let nextRound = [];
                let roundName = getRoundName(currentRound.length);
                
                for (let i = 0; i < currentRound.length; i += 2) {
                    let p1 = currentRound[i];
                    let p2 = currentRound[i+1];
                    let matchKey = roundIndex + '-' + (i/2);

                    if (p1.isBye || p2.isBye) {
                        nextRound.push(p1.isBye && p2.isBye ? p1 : (p1.isBye ? p2 : p1));
                        continue;
                    }

                    let decidedWinnerId = decisions[matchKey];
                    
                    if (decidedWinnerId === p1.id) {
                        nextRound.push(p1);
                        matchHistory.push({ matchKey, roundName, p1, p2, winner: p1, matchNumber: (i/2)+1, totalMatches: currentRound.length/2 });
                    } else if (decidedWinnerId === p2.id) {
                        nextRound.push(p2);
                        matchHistory.push({ matchKey, roundName, p1, p2, winner: p2, matchNumber: (i/2)+1, totalMatches: currentRound.length/2 });
                    } else {
                        if (!pendingMatch) {
                            pendingMatch = { matchKey, roundName, p1, p2, matchNumber: (i/2)+1, totalMatches: currentRound.length/2 };
                        }
                    }
                }
                if (pendingMatch) break; 
                currentRound = nextRound;
                roundIndex++;
            }

            if (pendingMatch) {
                displayMatch(pendingMatch);
            } else if (currentRound.length === 1) {
                showWinner(currentRound[0]);
            }
        }

        function displayMatch(m) {
            document.getElementById('winner-screen').style.display = 'none';
            document.getElementById('duel-screen').style.display = 'block';
            
            document.getElementById('round-title').innerText = m.roundName;
            document.getElementById('match-number').innerText = m.matchNumber;
            document.getElementById('total-matches').innerText = m.totalMatches;
            
            document.getElementById('name-left').innerText = m.p1.name;
            setSafeImage(document.getElementById('img-left'), m.p1.image_url);

            document.getElementById('name-right').innerText = m.p2.name;
            setSafeImage(document.getElementById('img-right'), m.p2.image_url);
            
            window.currentPendingMatchKey = m.matchKey;
            window.currentP1 = m.p1;
            window.currentP2 = m.p2;
        }

        window.selectWinner = function(side) {
            let winner = side === 'left' ? window.currentP1 : window.currentP2;
            decisions[window.currentPendingMatchKey] = winner.id;
            saveTournament(); 
            updateGame();
        };

        window.undoLastMatch = function() {
            if (matchHistory.length === 0) return alert("Rien à annuler !");
            let lastMatch = matchHistory[matchHistory.length - 1];
            delete decisions[lastMatch.matchKey]; 
            saveTournament(); 
            updateGame();
        };

        window.openHistory = function() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            
            if (matchHistory.length === 0) {
                list.innerHTML = '<p style="color:white;">Aucun match joué.</p>';
            } else {
                [...matchHistory].reverse().forEach((m) => {
                    let isP1Winner = m.winner.id === m.p1.id;
                    list.innerHTML += `
                        <div class="history-item">
                            <div>
                                <span style="color:#94a3b8; font-size:0.8rem;">${m.roundName}</span><br>
                                <span style="${isP1Winner ? 'color:#10b981; font-weight:bold;' : 'color:#94a3b8;'}">${m.p1.name}</span> 
                                <span style="color:#ef4444; margin:0 10px;">VS</span> 
                                <span style="${!isP1Winner ? 'color:#10b981; font-weight:bold;' : 'color:#94a3b8;'}">${m.p2.name}</span>
                            </div>
                            <button class="nav-btn" style="background:#ef4444; font-size: 0.9rem;" onclick="replayMatch('${m.matchKey}')">⏪ Refaire</button>
                        </div>
                    `;
                });
            }
            document.getElementById('history-modal').style.display = 'flex';
        };

        window.closeHistory = function() {
            document.getElementById('history-modal').style.display = 'none';
        };

        window.replayMatch = function(matchKey) {
            delete decisions[matchKey];
            let parts = matchKey.split('-');
            let r = parseInt(parts[0]);
            let m = parseInt(parts[1]);
            
            while (r < 20) {
                r++;
                m = Math.floor(m / 2); 
                delete decisions[r + '-' + m];
            }
            closeHistory();
            saveTournament(); 
            updateGame(); 
        };

        function showWinner(champion) {
            document.getElementById('duel-screen').style.display = 'none';
            document.getElementById('winner-screen').style.display = 'block';
            document.getElementById('winner-name').innerText = champion.name;
            setSafeImage(document.getElementById('winner-img'), champion.image_url);
        }

        initLobby();
    </script>
</body>
</html>
